[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "us-market-intelligence"
version = "0.1.0"
description = "Evidence-linked US market morning intelligence reports"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "exchange-calendars==4.13.2",
  "jinja2==3.1.6",
  "pydantic==2.13.4",
  "pyyaml==6.0.3",
  "tzdata==2026.3",
]

[project.optional-dependencies]
openai = [
  "openai==3.3.1",
]
dev = [
  "openai==3.3.1",
  "pytest==9.1.1",
  "pytest-cov==7.0.0",
  "ruff==0.16.4",
]

[project.scripts]
market-intelligence = "market_intelligence.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/market_intelligence"]

[tool.hatch.build.targets.sdist]
exclude = ["/actionlint_*.tar.gz"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
